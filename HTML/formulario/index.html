<section class="contact-form">

    <link rel="stylesheet" href="estilos.css">


<div class="form-box">


<h1>
Contáctanos
</h1>


<p>
Déjanos tus datos y te ayudaremos
</p>




<form id="formulario">



<div class="input-group">


<label>
Nombre completo
</label>


<input 
type="text"
id="nombre"
placeholder="Ej: Juan Pérez"
>


</div>





<div class="input-group">


<label>
Correo
</label>


<input 
type="email"
id="correo"
placeholder="correo@gmail.com"
>


</div>





<div class="input-group">


<label>
Teléfono
</label>


<input 
type="number"
id="telefono"
placeholder="3000000000"
>


</div>






<div class="input-group">


<label>
Servicio
</label>


<select id="servicio">


<option>
Seleccione
</option>

<option>
Tarjetas
</option>

<option>
Créditos
</option>

<option>
Cuenta digital
</option>


</select>



</div>







<div class="input-group">


<label>
Mensaje
</label>


<textarea 
id="mensaje"
placeholder="Escribe tu mensaje">
</textarea>


</div>





<button type="submit">

Enviar solicitud

</button>



<p id="resultado"></p>

<script src="js.js"></script>

</form>



</div>



</section>
