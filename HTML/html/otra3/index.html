<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link rel="stylesheet" href="estilosss34.css">

</head>


<body>



<div class="container">



<div class="login-box">



<h1>

Bienvenido

</h1>


<p>

Inicia sesión para continuar

</p>



<form id="loginForm">



<div class="input">

<label>
Usuario
</label>


<input 
type="text"
id="username"
placeholder="Ingrese usuario"
>


</div>






<div class="input">


<label>
Contraseña
</label>



<div class="password">


<input
type="password"
id="password"
placeholder="Ingrese contraseña"
>


<button 
type="button"
id="show">
👁
</button>


</div>


</div>






<button class="login-btn">

Ingresar

</button>





<p id="message"></p>




</form>




</div>



</div>




<script src="javas23.js"></script>


</body>

</html>
